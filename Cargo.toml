[package]
name = "openshell-driver-substrate"
description = "Agent Substrate compute driver for OpenShell"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dims/openshell-driver-substrate"
build = "build.rs"

[dependencies]
# Pin to the rebased PR #1549 branch tip (`feat/sandbox-failure-handler`) on the
# OpenShell fork. We only need the env-var-name constants and compute proto
# types from openshell-core (SANDBOX_ID, ENDPOINT, SANDBOX_TOKEN, ComputeDriver);
# the patched openshell-sandbox binary itself is built from the same source by
# tests/integration/build-image.sh. Degraded boot is opt-in via the
# --skip-bootstrap flag / OPENSHELL_SKIP_BOOTSTRAP env var.
openshell-core = { git = "https://github.com/dims/OpenShell", rev = "5112fca71d52fab22d8823cc8f2e3fb776abd17c" }

tokio = { version = "1.43", features = ["full"] }
# `tls-native-roots` pulls in tonic's rustls-based TLS stack with the
# host's system trust roots, which is the minimum needed to dial
# https://ate-api-server endpoints under a custom CA.
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
kube = { version = "0.90", features = ["runtime", "derive"] }
# `schemars` feature is required so the CRD-mirror types in
# `template.rs` can derive `JsonSchema` over k8s-openapi types like
# ContainerPort, EnvVar, ObjectReference.
k8s-openapi = { version = "0.21.1", features = ["v1_26", "schemars"] }
schemars = "0.8"

[build-dependencies]
tonic-prost-build = "0.14"
protobuf-src = "1.1.0"

[dev-dependencies]
tempfile = "3"
