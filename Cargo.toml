[workspace]
members = ["harness/bootstrap-gen"]

# Genuine upstream OpenShell, unmodified. One rev for the driver and for
# bootstrap-gen, so the credentials it mints match the binaries in the images.
[workspace.dependencies]
# No default features: they add telemetry and an HTTP client nothing here uses.
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "5d25211b25a8fc887e8d5c606d57d6ab22f1d76c", default-features = false }
openshell-sandbox-backend = { git = "https://github.com/NVIDIA/OpenShell", rev = "5d25211b25a8fc887e8d5c606d57d6ab22f1d76c" }
openshell-isolation-interface = { git = "https://github.com/NVIDIA/OpenShell", rev = "5d25211b25a8fc887e8d5c606d57d6ab22f1d76c" }

[package]
name = "openshell-driver-substrate"
description = "Agent Substrate compute driver for OpenShell"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/dims/openshell-driver-substrate"
build = "build.rs"

[[bin]]
name = "openshell-driver-substrate"
path = "src/main.rs"

[dependencies]
# The compute-driver proto types, driver_utils, resource_admission and
# extension_protocol. The driver registers out of process (ComputeDriverServer
# over a socket), so no gateway code or fork is needed.
openshell-core = { workspace = true }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync"] }
# rustls with aws-lc for the TLS to ate-api-server. The CA always comes from
# --api-tls-ca, so no root store is needed.
tonic = { version = "0.14", features = ["transport", "tls-aws-lc"] }
tonic-prost = "0.14"
prost = "0.14"
# Not named in src; the generated client uses it for Timestamp.
prost-types = "0.14"
# The configuration file: TOML, with ActorTemplate and EgressPolicy fragments
# decoded from protojson YAML through the descriptor set build.rs writes.
prost-reflect = { version = "0.16", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "1"
# Server reflection on the socket, so grpcurl needs no proto files.
tonic-reflection = "=0.14.6"
# Already in the graph through openshell-core; declared here for the template name.
sha2 = "0.10"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
