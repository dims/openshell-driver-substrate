[package]
name = "openshell-driver-substrate"
description = "Agent Substrate compute driver for OpenShell"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dims/openshell-driver-substrate"
build = "build.rs"

[[bin]]
name = "openshell-driver-substrate"
path = "src/main.rs"

[dependencies]
# Genuine upstream OpenShell, unmodified. The driver only needs the
# generated compute-driver proto types and a couple of env-var-name
# constants; it registers as an out-of-process driver
# (ComputeDriverServer over a socket), so no gateway code or fork is
# needed on the OpenShell side.
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "3107ff1f828f0d5ea960ad5cda2948309fbec8cf" }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1.43", features = ["full"] }
# `tls-native-roots` pulls in tonic's rustls-based TLS stack with the
# host's system trust roots, which is the minimum needed to dial
# https://ate-api-server endpoints under a custom CA.
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
futures = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[build-dependencies]
tonic-prost-build = "0.14"
protobuf-src = "1.1.0"

[dev-dependencies]
tempfile = "3"
