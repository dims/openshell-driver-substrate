version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /etc
    - /opt/helpdesk
  read_write:
    - /tmp
    - /dev/null

# Micro-VM guests have Landlock, so a failure here is a real one.
landlock:
  compatibility: hard_requirement

process:
  run_as_user: "65532"
  run_as_group: "65532"

# Default deny. To allow a host, name it and the binary that may reach it
# (the supervisor requires the binary; the path is the resolved executable):
#
#   network_policies:
#     model:
#       endpoints:
#         - host: 172.18.0.1
#           ports: [11434]
#       binaries:
#         - path: /usr/local/bin/python3.12
network_policies: {}
