version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /etc
    - /opt/helpdesk
  read_write:
    - /tmp
    - /dev/null

# Micro-VM guests have Landlock, so a failure here is a real one.
landlock:
  compatibility: hard_requirement

process:
  run_as_user: "65532"
  run_as_group: "65532"

# Default deny. Egress hosts get added here.
network_policies: {}
