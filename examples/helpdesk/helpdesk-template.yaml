apiVersion: v1
kind: Namespace
metadata:
  name: ate-demo-helpdesk
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: helpdesk-pool
  namespace: ate-demo-helpdesk
  labels:
    workload: helpdesk
spec:
  replicas: 2
  ateomImage: __ATEOM_IMAGE__
---
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: helpdesk-agent
  namespace: ate-demo-helpdesk
spec:
  pauseImage: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
  containers:
  - name: supervisor
    image: __SUPERVISOR_IMAGE__
    command:
    - /usr/local/bin/openshell-sandbox
    - --policy-rules
    - /etc/openshell/policy.rego
    - --policy-data
    - /etc/openshell/data.yaml
    - --inference-routes
    - /etc/openshell/routes.yaml
    - --log-level
    - info
    - --
    - python3
    - /opt/helpdesk/agent.py
    env:
    # atelet's OCI bundle builder does not inherit the base image's ENV,
    # so we re-state OPENSHELL_BEST_EFFORT_BOOTSTRAP=all explicitly here.
    - name: OPENSHELL_BEST_EFFORT_BOOTSTRAP
      value: "all"
  # WorkerPool↔ActorTemplate coupling moved to label selection (substrate
  # #270/#261); runsc moved to the cluster-default SandboxConfig. Select the
  # helpdesk pool by label; the gvisor-default SandboxConfig supplies runsc.
  workerSelector:
    matchLabels:
      workload: helpdesk
  snapshotsConfig:
    location: gs://ate-snapshots/ate-demo-helpdesk/
