[package]
name = "bootstrap-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
# Same upstream rev the driver pins, so the generated bundle matches the
# binaries in the sandbox/supervisor images.
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "3107ff1f828f0d5ea960ad5cda2948309fbec8cf", features = ["jwt"] }
openshell-sandbox-backend = { git = "https://github.com/NVIDIA/OpenShell", rev = "3107ff1f828f0d5ea960ad5cda2948309fbec8cf" }
openshell-isolation-interface = { git = "https://github.com/NVIDIA/OpenShell", rev = "3107ff1f828f0d5ea960ad5cda2948309fbec8cf" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
