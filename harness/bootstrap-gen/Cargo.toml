[package]
name = "bootstrap-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
# Same upstream rev the driver pins, so the generated bundle matches the
# binaries in the sandbox/supervisor images.
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "d3480d2a7efab3fd0217ab67828655617b9af777", features = ["jwt"] }
openshell-sandbox-backend = { git = "https://github.com/NVIDIA/OpenShell", rev = "d3480d2a7efab3fd0217ab67828655617b9af777" }
openshell-isolation-interface = { git = "https://github.com/NVIDIA/OpenShell", rev = "d3480d2a7efab3fd0217ab67828655617b9af777" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
